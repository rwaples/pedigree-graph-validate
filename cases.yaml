      - {stat: ne_idf_t1, reference: target, published: 3.83865, source: "purgeR vignette; Heredity 2021 abstract (4)"}
      - {stat: fe, reference: target, gap: B1, published: 1.769424, source: "purgeR tutorial vignette, pop_Nancestors table"}
  - id: dorcas
    input: {bundled: purgeR::dorcas}
    families: [kinship, classification, ne]
    ne:
      - {stat: ne_idf_t1, reference: final_cohort}
      - {stat: fe, reference: final_cohort}
      - {stat: ne_idf_t1, reference: target, published: 39.32125, source: "purgeR vignette; Heredity 2021 abstract (39)"}
      - {stat: fe, reference: target, gap: B1, published: 13.38647, source: "purgeR test_population_parameters.R:29"}
      - {stat: fa, reference: target, gap: B2, published: 12.9906, source: "purgeR test_population_parameters.R:30"}
  - id: deep_ped
